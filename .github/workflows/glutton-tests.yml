name: Glutton parser tests
on:
  pull_request:
    paths: ['honeypots/glutton.py', 'tests/test_glutton.py', '.github/workflows/glutton-tests.yml']
  push:
    branches: [master]
    paths: ['honeypots/glutton.py', 'tests/test_glutton.py', '.github/workflows/glutton-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p test_glutton.py -v
